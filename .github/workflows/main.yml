name: Bundle and Publish Sources
on: 
  push:
    branches:
      - '**'
      - '!main'
jobs:
  build:
    name: Bundle and Publish Sources
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x]

    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Extract branch name
        shell: bash
        run: echo "branch=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Checkout existing bundles
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: bundles

      - run: npm install
      
      # Genera il bundle (crea una index.html automatica)
      - run: npm run bundle -- --folder=${{ steps.extract_branch.outputs.branch }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}

      # NUOVO PASSAGGIO: Sovrascrive la homepage automatica con la tua personalizzata
      - name: Override Homepage
        run: |
          if [ -f "homepage.html" ]; then
            echo "Trovato file homepage.html personalizzato. Sovrascrittura in corso..."
            cp homepage.html bundles/index.html
          else
            echo "Nessun file homepage.html trovato. Uso quella generata automaticamente."
          fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: bundles