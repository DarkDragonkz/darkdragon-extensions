name: Bundle and Publish Sources
on: 
  push:
    branches:
      - '**'
      - '!main'
jobs:
  build:
    name: Bundle and Publish Sources
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [16.x] # Aggiornato a 16.x per stabilità con le nuove actions

    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Extract branch name
        shell: bash
        # FIX: Nuova sintassi per gli output di GitHub Actions
        run: echo "branch=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Checkout existing bundles
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: bundles

      - run: npm install
      # Nota: Assicurati che lo script 'bundle' nel package.json supporti l'argomento --folder
      - run: npm run bundle -- --folder=${{ steps.extract_branch.outputs.branch }}

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@4.1.0
        with:
          branch: gh-pages
          folder: bundles