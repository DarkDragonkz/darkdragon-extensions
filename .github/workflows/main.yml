name: Bundle and Publish Sources
on: 
  push:
    branches:
      - '**'
      - '!main'
jobs:
  build:
    name: Bundle and Publish Sources
    runs-on: ubuntu-latest

    permissions:
      contents: write

    strategy:
      matrix:
        node-version: [16.x] 

    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Extract branch name
        shell: bash
        run: echo "branch=$(echo ${GITHUB_REF#refs/heads/})" >> $GITHUB_OUTPUT
        id: extract_branch

      - name: Checkout existing bundles
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: bundles

      - run: npm install
      
      # Crea l'estensione (questo passaggio spesso svuota la cartella bundles)
      - run: npm run bundle -- --folder=${{ steps.extract_branch.outputs.branch }}

      # FIX: Prende il file index.html dalla root e lo copia forzatamente dentro bundles
      - name: Copy custom Homepage
        run: |
          if [ -f "index.html" ]; then
            echo "Trovato index.html personalizzato. Lo copio in bundles..."
            cp index.html bundles/index.html
          else
            echo "ATTENZIONE: index.html non trovato nella root!"
          fi

      # Disabilita Jekyll per evitare errori strani con i percorsi
      - name: Disable Jekyll
        run: touch bundles/.nojekyll

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: bundles